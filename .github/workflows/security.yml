name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read
  security-events: write

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-go@v6
        id: go
        with:
          go-version-file: go.mod
          cache: true

      - uses: jdx/mise-action@v4
        with:
          version: 2026.4.28
          install: true
          cache: true
          # Cached govulncheck binaries must understand this Go language version.
          cache_key_prefix: mise-v1-go-${{ steps.go.outputs.go-version }}

      - name: govulncheck
        run: |
          go version -m "$(mise which govulncheck)"
          mise exec -- govulncheck ./...

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: github/codeql-action/init@v4
        with:
          languages: go
          config-file: ./.github/codeql/codeql-config.yml

      - uses: github/codeql-action/autobuild@v4

      - uses: github/codeql-action/analyze@v4
